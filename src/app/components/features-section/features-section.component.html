<section class="features-section">
  <div class="container">
    <div class="features-grid">
      
      <!-- Career Guidance AI -->
      <div class="feature-card">
        <div class="icon-wrapper">
          <img src="assets/career-icon.png" alt="Career Guidance" class="feature-icon">
        </div>
        <h3 class="feature-title">Career Guidance AI</h3>
        <p class="feature-description">Discover the best career options for you.</p>
        <button type="button" class="feature-link" (click)="selectTool('career-guidance')">Open guidance</button>
      </div>

      <!-- Study Recommendations -->
      <div class="feature-card">
        <div class="icon-wrapper">
          <img src="assets/study-icon.png" alt="Study Recommendations" class="feature-icon">
        </div>
        <h3 class="feature-title">Study Recommendations</h3>
        <p class="feature-description">Learn what subjects and skills suit you.</p>
        <button type="button" class="feature-link" (click)="selectTool('study-recommend')">Open recommendations</button>
      </div>

      <!-- Internship Finder -->
      <div class="feature-card">
        <div class="icon-wrapper">
          <img src="assets/internship-icon.png" alt="Internship Finder" class="feature-icon">
        </div>
        <h3 class="feature-title">Internship Finder</h3>
        <p class="feature-description">Find the best internships for your field.</p>
        <button type="button" class="feature-link" (click)="selectTool('internship-finder')">Open finder</button>
      </div>

      <!-- Code Error Fixer -->
      <div class="feature-card">
        <div class="icon-wrapper">
          <img src="assets/code-icon.png" alt="Code Error Fixer" class="feature-icon">
        </div>
        <h3 class="feature-title">Code Error Fixer</h3>
        <p class="feature-description">Identify and fix your coding errors.</p>
        <button type="button" class="feature-link" (click)="selectTool('code-fixer')">Open fixer</button>
      </div>

    </div>
  </div>
</section>
