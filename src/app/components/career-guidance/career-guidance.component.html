<section class="tool-panel">
	<header class="tool-header">
		<div>
			<p class="eyebrow">Path planner</p>
			<h2>Career Guidance</h2>
			<p class="lede">Describe what you enjoy and we will surface career tracks plus concrete next steps.</p>
		</div>
		<img [src]="imageSrc" alt="Career Guidance" class="tool-visual" />
	</header>

	<form class="input-grid" (ngSubmit)="generateGuidance()">
		<label class="field">
			<span class="field-label">Name</span>
			<input
				name="name"
				[(ngModel)]="profile.name"
				type="text"
				placeholder="Your name"
				disabled
			/>
		</label>

		<label class="field">
			<span class="field-label">Course</span>
			<input
				name="course"
				[(ngModel)]="profile.course"
				type="text"
				placeholder="Your course"
				disabled
			/>
		</label>

		<label class="field">
			<span class="field-label">Future Goal</span>
			<input
				name="futureGoal"
				[(ngModel)]="profile.futureGoal"
				type="text"
				placeholder="e.g. Backend Engineer, Data Analyst"
			/>
		</label>

		<label class="field wide">
			<span class="field-label">Current Skills</span>
			<textarea
				name="currentSkills"
				[(ngModel)]="profile.currentSkills"
				rows="3"
				placeholder="e.g. SQL, TypeScript, problem solving"
			></textarea>
		</label>

		<label class="field wide">
			<span class="field-label">Description</span>
			<textarea
				name="description"
				[(ngModel)]="profile.description"
				rows="3"
				placeholder="Briefly describe your interests or experience"
			></textarea>
		</label>

		<button type="submit" class="primary">Generate guidance</button>
	</form>

		<!-- Loading and error messages -->
		<div class="status" *ngIf="loading">Generating personalized guidance…</div>
		<div class="status" *ngIf="!loading && errorMessage">{{ errorMessage }}</div>

		<!-- Results Modal -->
		<div class="results-modal" *ngIf="showResultsModal">
		<div class="modal-backdrop" (click)="closeModal()"></div>
		<div class="modal-content">
			<button class="modal-close" (click)="closeModal()">×</button>
			<header class="modal-header">
				<h3>Your Personalized Career Guidance</h3>
				<p class="modal-sub">AI-powered insights based on your profile</p>
			</header>
			<section class="modal-body">
				<div class="guidance-display" (click)="skipTyping()">
					<div class="guidance-content" [innerText]="displayedContent"></div>
					<span class="typing-cursor" *ngIf="isTyping">▋</span>
				</div>
				<div class="skip-hint" *ngIf="isTyping">
					<small>Click anywhere to skip animation</small>
				</div>
			</section>
		</div>
	</div>
