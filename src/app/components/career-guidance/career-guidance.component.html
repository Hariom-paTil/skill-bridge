<div class="roadmap-wrapper">
	<div class="roadmap-card">
		<header class="roadmap-header">
			<h1>Full Career Roadmap</h1>
			<p>Describe what you enjoy and we will surface career tracks plus concrete next steps.</p>
		</header>

		<form class="roadmap-form" (ngSubmit)="generateGuidance()">
			<div class="form-group">
				<label>Name</label>
				<input name="name" [(ngModel)]="profile.name" type="text" placeholder="Your name" disabled />
			</div>

			<div class="form-group">
				<label>Course</label>
				<input name="course" [(ngModel)]="profile.course" type="text" placeholder="Your course" disabled />
			</div>

			<div class="form-group">
				<label>Future Goal</label>
				<input name="futureGoal" [(ngModel)]="profile.futureGoal" type="text"
					placeholder="e.g. Backend Engineer, Data Analyst" />
			</div>

			<div class="form-group full-width">
				<label>Current Skills</label>
				<textarea name="currentSkills" [(ngModel)]="profile.currentSkills" rows="3"
					placeholder="e.g. SQL, TypeScript, problem solving"></textarea>
			</div>

			<div class="form-group full-width">
				<label>Description</label>
				<textarea name="description" [(ngModel)]="profile.description" rows="3"
					placeholder="Briefly describe your interests or experience"></textarea>
			</div>

			<div class="generate-btn">
				<button type="submit">Generate guidance</button>
				<div *ngIf="loading" style="margin-top: 1rem; color: #a5b4fc; text-align: center;">Generating
					personalized guidance…</div>
				<div *ngIf="!loading && errorMessage" style="margin-top: 1rem; color: #ff6b6b; text-align: center;">{{
					errorMessage }}</div>
			</div>
		</form>
	</div>
</div>

<!-- Results Modal -->
<div class="results-modal" *ngIf="showResultsModal">
	<div class="modal-backdrop" (click)="closeModal()"></div>
	<div class="modal-content">
		<button class="modal-close" (click)="closeModal()">×</button>
		<header class="modal-header">
			<h3>Your Full Career Roadmap</h3>
			<p class="modal-sub">AI-powered insights based on your profile</p>
		</header>
		<section class="modal-body">
			<div class="guidance-display" (click)="skipTyping()">
				<div class="guidance-content" [innerHTML]="displayedContent"></div>
			</div>
		</section>
	</div>
</div>
