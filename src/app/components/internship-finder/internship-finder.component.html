<div class="modal-backdrop" *ngIf="isOpen" (click)="close()"></div>

<div class="modal-card" *ngIf="isOpen">
	<header class="modal-header">
		<h2>Find top internships for you</h2>
		<button class="close-btn" (click)="close()">×</button>
	</header>

	<div class="form-card">
		<label>
			Internship Role (optional)
			<select [(ngModel)]="form.role">
				<option value="">Select role</option>
				<option *ngFor="let role of roles" [value]="role">{{ role }}</option>
			</select>
		</label>

		<div class="radio-group">
			<p>Work Mode</p>
			<div class="work-mode-options">
				<label class="radio-card" [class.active]="form.workMode === 'remote'">
					<input type="radio" name="workMode" value="remote" [(ngModel)]="form.workMode"
						(change)="onWorkModeChange()" />
					<span class="mode-icon">🏠</span>
					<span class="mode-label">Remote</span>
				</label>
				<label class="radio-card" [class.active]="form.workMode === 'offline'">
					<input type="radio" name="workMode" value="offline" [(ngModel)]="form.workMode"
						(change)="onWorkModeChange()" />
					<span class="mode-icon">🏢</span>
					<span class="mode-label">Offline</span>
				</label>
			</div>
		</div>

		<label *ngIf="form.workMode === 'offline'" class="fade-in">
			Location
			<select [(ngModel)]="form.location">
				<option value="">Select location</option>
				<option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
			</select>
		</label>

		<label>
			Qualification
			<select [(ngModel)]="form.qualification" (change)="updateSkills()">
				<option value="">Select qualification</option>
				<option *ngFor="let qual of qualifications" [value]="qual">{{ qual }}</option>
			</select>
		</label>

		<div *ngIf="availableSkills.length > 0" class="skills-section">
			<p>Recommended Skills</p>
			<div class="skills-grid">
				<label *ngFor="let skill of availableSkills" class="skill-chip"
					[class.selected]="form.skills.includes(skill)">
					<input type="checkbox" [value]="skill" (change)="toggleSkill($event, skill)"
						[checked]="form.skills.includes(skill)" />
					<span class="checkmark">✓</span>
					{{ skill }}
				</label>
			</div>
		</div>

		<label>
			Add Skill Manually
			<div class="input-with-btn">
				<input type="text" [(ngModel)]="manualSkill" placeholder="e.g., Angular, Excel" />
				<button type="button" class="add-btn" (click)="addManualSkill()">Add</button>
			</div>
		</label>

		<div class="form-actions">
			<button type="button" (click)="resetForm()">Reset</button>
			<button type="button" (click)="submitForm()">Find Internships</button>
		</div>
	</div>
</div>
