<div class="auth-form">
  <h2>Sign Up</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-row">
      <div class="form-field">
        <label>First Name</label>
        <input type="text" [(ngModel)]="firstName" name="firstName" required placeholder="First name">
      </div>
      <div class="form-field">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="lastName" name="lastName" required placeholder="Last name">
      </div>
    </div>
    <div class="form-field">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email">
    </div>
    <div class="form-field">
      <label>Course</label>
      <select [(ngModel)]="education" name="education">
        <option value="imca">IMCA (ID: 101)</option>
        <option value="bca">BCA (ID: 101)</option>
        <option value="bba">BBA (ID: 102)</option>
        <option value="bms">BMS (ID: 103)</option>
      </select>
    </div>
    <div class="form-field">
      <label>Password</label>
      <input type="password" [(ngModel)]="password" name="password" required placeholder="Create a password">
    </div>
    <button type="submit" class="btn-primary">Sign Up</button>
  </form>
  <p class="switch-link">
    Already have an account? <a (click)="switchToLogin()">Login</a>
  </p>
</div>
